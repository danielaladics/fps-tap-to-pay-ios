name: fps_tap_to_pay_ios
description: Shows Apple's Tap to Pay on iPhone merchant education (ProximityReaderDiscovery) from Flutter. Used by FPS APP.
version: 1.0.0
homepage: https://github.com/danielaladics/fps-tap-to-pay-ios
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FpsTapToPayIosPlugin
